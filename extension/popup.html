<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { width: 280px; margin:0; font:13px system-ui,sans-serif; background:#171a21; color:#e6e9ef; }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid #262b36; }
  .logo { width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#5b8cff,#9d7bff); }
  h1 { font-size:14px; margin:0; }
  .body { padding:12px 14px; }
  .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #262b36; }
  .stat:last-child { border:none; }
  .b { color:#f85149; } .w { color:#d29922; } .r { color:#58a6ff; }
  label.toggle { display:flex; align-items:center; justify-content:space-between; padding:8px 0; }
  select, a.btn { background:#0f1115; color:#e6e9ef; border:1px solid #262b36; border-radius:7px; padding:5px 8px; font:12px system-ui; }
  a.btn { display:block; text-align:center; text-decoration:none; margin-top:10px; padding:8px; }
  .muted { color:#8b93a7; font-size:11px; }
</style></head>
<body>
<header><div class="logo"></div><h1>Lump</h1><span id="site" class="muted" style="margin-left:auto"></span></header>
<div class="body">
  <div class="stat"><span class="b">Blocked</span><span id="blocked">0</span></div>
  <div class="stat"><span class="r">Redacted</span><span id="redacted">0</span></div>
  <div class="stat"><span class="w">Warned</span><span id="warned">0</span></div>
  <label class="toggle"><span>Protection</span>
    <select id="mode"><option value="warn">Warn</option><option value="block">Block</option><option value="monitor">Monitor only</option></select>
  </label>
  <a class="btn" id="options" href="#">Settings</a>
</div>
<script src="popup.js"></script>
</body></html>
