name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[dev]'
      - run: ruff check src/
      - run: pytest
      - run: lump bench
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e .
      - name: Rules and model in the extension are current
        run: |
          lump export-rules -o /tmp/rules.json && diff -q /tmp/rules.json extension/rules.json
          mkdir -p /tmp/tiny && python -m lump.ml.fixture --tiny /tmp/tiny
          cmp /tmp/tiny/tiny.lumpml extension/test/tiny.lumpml && diff -q /tmp/tiny/tiny_fixture.json extension/test/tiny_fixture.json
          if [ -f src/lump/data/models/injection-v1.lumpml ]; then
            cmp src/lump/data/models/injection-v1.lumpml extension/models/injection-v1.lumpml
            python -m lump.ml.fixture > /tmp/ml_fixture.json && diff -q /tmp/ml_fixture.json extension/test/ml_fixture.json
          fi
      - run: node --test extension/test/detector.test.js extension/test/ml.test.js
